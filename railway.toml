# Railway worker service configuration.
#
# This file configures the *worker* Railway service only — the web app deploys
# to Vercel and never reads it. Point the service's Root Directory at the repo
# root; Railway picks up this file automatically.
#
# Healthchecks must pass before a deploy receives traffic, and `/health` on the
# worker reports queue connectivity + engine readiness (scraper/src/health.ts),
# so a deploy that can't reach Supabase or can't exec the engine is marked
# failed instead of silently sitting in rotation.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# One replica is intentional: jobs are claimed one at a time per worker and
# mailbox daily caps are enforced per-process. Scale by adding replicas only
# after confirming claim_scrape_job contention is acceptable (leases make it
# safe, but throughput per mailbox is deliberately serialised).
numReplicas = 1

# The worker drains gracefully on SIGTERM (WORKER_DRAIN_TIMEOUT_MS, default
# 30s): it stops claiming, finishes the in-flight job, and requeues nothing —
# the lease simply expires and /api/cron/recover would requeue it if the drain
# overran. No extra Railway draining configuration is required at 30s.
